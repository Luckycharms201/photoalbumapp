# Fly.io configuration for the photo album app.
# `app` must be globally unique — flyctl will set it during `fly launch`,
# or change it here before deploying.
app = "photoalbumapp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATA_DIR = "/data/db"
  UPLOADS_DIR = "/data/uploads"

# Persistent volume holding the SQLite DB (/data/db) and uploads (/data/uploads).
[[mounts]]
  source = "photo_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
